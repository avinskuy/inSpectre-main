<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="inSpectre — periksa link, nomor, dan file APK mencurigakan sebelum jadi korban phishing & penipuan." />
    <meta name="theme-color" content="#10b981" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <title>inSpectre — Cek Phishing &amp; Penipuan</title>
    <!-- Terapkan tema sebelum React render, supaya tidak berkedip terang → gelap -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('inspectre-prefs') || '{}');
        var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-cyber-bg text-cyber-text">
    <div id="root">
      <div id="boot-fallback" style="position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;background:#07131d;color:#eafaf6;font-family:system-ui,sans-serif">
        <div style="text-align:center;padding:24px">
          <div style="display:grid;place-items:center;width:76px;height:76px;margin:0 auto 24px;border:1px solid rgba(114,234,208,.35);border-radius:24px;color:#72ead0;font-size:38px;background:rgba(114,234,208,.08)">⌁</div>
          <div style="font-size:9px;font-weight:800;letter-spacing:.25em;color:#83c8bd">DIGITAL THREAT INTELLIGENCE</div>
          <div style="margin-top:8px;font-size:48px;font-weight:800;letter-spacing:-.07em">inSpectre<span style="color:#72ead0">.</span></div>
          <div style="margin-top:12px;color:#a9bac7;font-size:13px">Menyiapkan perlindungan digital…</div>
          <div style="width:190px;height:3px;margin:24px auto 0;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden"><div style="width:45%;height:100%;background:#72ead0;animation:boot-fallback-progress 1.1s ease-in-out infinite alternate"></div></div>
        </div>
      </div>
      <style>@keyframes boot-fallback-progress{from{transform:translateX(-10%)}to{transform:translateX(130%)}}@media(prefers-reduced-motion:reduce){#boot-fallback *{animation:none!important}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
